---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.devanshops.rewrite.helidon.SpringBoot4ToHelidonMp
displayName: Migrate Spring Boot 4 to Helidon MP
description: >-
  Applies the supported mechanical Spring-to-Jakarta, CDI, and MicroProfile migrations,
  prepares the Maven build for Helidon MP, adds bootstrap resources, and marks remaining Spring usage.
tags:
  - spring
  - helidon
  - migration
estimatedEffortPerOccurrence: PT30M
# Scanning safety gates assess the original module before sibling recipes migrate it. Follow-up
# cycles re-evaluate the post-migration module before replacing and stabilizing the Boot launcher.
causesAnotherCycle: true
preconditions:
  - org.openrewrite.Singleton
recipeList:
  # Build preparation intentionally keeps the existing parent and all Spring dependencies.
  - io.github.devanshops.rewrite.helidon.PrepareMavenBuildForHelidonMp
  # Resource discovery must run before the Spring Boot entry point is rewritten.
  - io.github.devanshops.rewrite.helidon.AddHelidonMpResources
  # Named beans run first so the general DI recipe can handle the remaining argument-free annotations.
  - io.github.devanshops.rewrite.helidon.MigrateSpringNamedBeansToCdi
  - io.github.devanshops.rewrite.helidon.MigrateSpringDiToCdi
  - io.github.devanshops.rewrite.helidon.MigrateResponseEntityToJakartaResponse
  - io.github.devanshops.rewrite.helidon.MigrateSpringMvcToJakartaRest
  # Transaction/config migration runs after controller decisions so skipped Spring classes remain intact.
  - io.github.devanshops.rewrite.helidon.MigrateSpringTransactionalToJakarta
  - io.github.devanshops.rewrite.helidon.MigrateSpringValueToConfigProperty
  - io.github.devanshops.rewrite.helidon.MigrateSpringBootMain
  - io.github.devanshops.rewrite.helidon.FindSpringUsage

